# Black Mamba home server - starting stack.
#
#   /srv/apps    tier 0, SSD  - container state. Fast disk, backed up nightly.
#   /srv/media   tier 1, HDD  - the 1.5 TB disk. Served over LAN.
#   /srv/archive tier 2       - read-only rclone mount of Google Drive.
#
# Nothing here writes to /srv/archive. Keep it that way.

services:

  samba:
    image: dperson/samba:latest
    container_name: samba
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Jerusalem}
    command: >
      -u "${SMB_USER};${SMB_PASS}"
      -s "media;/srv/media;yes;no;no;${SMB_USER}"
      -s "archive;/srv/archive;yes;yes;no;${SMB_USER}"
      -g "server min protocol = SMB3"
    volumes:
      - /srv/media:/srv/media
      - /srv/archive:/srv/archive:ro

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8096:8096"
    environment:
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - /srv/apps/jellyfin/config:/config
      - /srv/apps/jellyfin/cache:/cache
      - /srv/media:/media
      - /srv/archive:/archive:ro
    devices:
      # Intel/AMD hardware transcoding. Drop this block if the GPU isn't there.
      - /dev/dri:/dev/dri

  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    hostname: blackmamba
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8384:8384"      # web UI
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    environment:
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - /srv/apps/syncthing:/var/syncthing/config
      - /srv/media/work:/var/syncthing/work

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/config:/config

# Create a .env next to this file:
#
#   TZ=Asia/Jerusalem
#   PUID=1000
#   PGID=1000
#   SMB_USER=dano
#   SMB_PASS=<something long>
#
# Do not commit .env anywhere.
